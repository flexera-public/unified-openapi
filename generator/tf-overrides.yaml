  credential-oauth2:
    # OAuth2 create/update payloads diverge (schema polymorphism); the
    # generator's body builder reuses the create-body type for update
    # which produces a type-mismatch on the unified client call.
    # Sidestepped by pinning ONLY create/read/delete (no `update` key)
