  # ---- ITAM / LOW priority — SKIP -------------------------------------

  # licens — SKIPPED ENTIRELY (`skip: true` removes from generated output)
  #
  # Why this entry exists with skip:true:
  #   1. The kebab-case name `licens` is the result of a heuristic
  #      singularization bug: the path segment is `/saas-data/v1/orgs/
  #      {orgId}/licenses/{id}`, and openapi_specs/annotate.go's
  #      `singularize` helper trims a trailing 's' → "licens". This is a
  #      generator-side bug that we'll fix in a follow-up; until then,
  #      this entry stops the broken name from leaking into TF.
  #   2. Per the user direction (Phase 6 product-domain triage), ITAM
  #      lifecycle resources are LOW priority — they're not typically
  #      managed via Terraform; customers consume them through the
  #      FlexeraOne UI. Even with a fixed name, this resource is not
  #      a Phase 6 deliverable.
  #
  # Behaviorally:
  #   - With overrides activated, regentf reports licens under "skipped
  #     (override skip:true)" and does NOT emit licens_resource_gen.go.
  #   - With overrides off (default heuristic mode), licens still emits
  #     as before — the skip is opt-in.
  licens:
    skip: true

  # ---- Credentials API (Phase 14 PUT-as-create) ----------------------
  #
  # Common shape (all 8 credential types):
  #   PUT    /cred/v2/orgs/{orgId}/credentials/<scheme>/{id}   replace = create-or-replace
  #   PATCH  /cred/v2/orgs/{orgId}/credentials/<scheme>/{id}   update
  #   GET    /cred/v2/orgs/{orgId}/credentials/<scheme>/{id}   show
  #   DELETE /cred/v2/orgs/{orgId}/credentials/{scheme}/{id}   delete (umbrella `credential` label)
  #
  # The PUT carries `x-flexera-action: replace`; there is NO POST
  # collection. The user supplies the resource id (e.g. `flexera-shawn`)
  # as the trailing path segment. Pinning the PUT as `crud.create:`
  # triggers the IDInCreatePath generator path: the id attribute is
  # marked Required + ForceNew (NOT Computed), and the Create method
  # passes plan.Id into the URL.
  #
  # The DELETE is on the umbrella `credential` resource label and uses
  # `{scheme}` as a path discriminator. Cross-label aliasing pulls it
  # in. The {scheme} value (`basic`, `aws-sts`, ...) is filled by the
  # generator's structural-alignment of read vs delete paths.
  #
  # Show response carries server-stamped fields the create body does
  # not (createdAt, createdBy, kind, ref, scheme, updatedAt, updatedBy,
  # orgId). These are auto-classified as Computed.

  credential-basic:
    crud:
      create: Cred_Basic_Credential_create_org   # PUT replace = create-or-replace
      read:   Cred_Basic_Credential_show_org
      update: Cred_Basic_Credential_update_org
      delete: Cred_Credential_delete_org          # cross-label, umbrella
    id_field: id
    import_id: "{orgId}/{id}"
    sensitive:
      - password

  credential-aws-sts:
    crud:
      create: Cred_AWS_STS_Credential_create_org
      read:   Cred_AWS_STS_Credential_show_org
      update: Cred_AWS_STS_Credential_update_org
      delete: Cred_Credential_delete_org
    id_field: id
    import_id: "{orgId}/{id}"
    # accessKey/secretKey are present for the legacy access-key flow;
    # the role-arn flow leaves them empty. Mark sensitive defensively.
    sensitive:
      - accessKey
      - secretKey

  credential-api-key:
    crud:
      create: Cred_API_Key_Credential_create_org
      read:   Cred_API_Key_Credential_show_org
      update: Cred_API_Key_Credential_update_org
