info:
    description: "You can use this API to upload bills to Flexera.\n\nBefore you can upload bills, remember to create a CBI Bill Connect using the [Flexera CBI Bill Connect API](https://reference.rightscale.com/optima-bill/#/CBIBillConnect).\n\nThe API is available at the following endpoints:\n* (NAM) https://api.optima.flexeraeng.com\n* (EU) https://api.optima-eu.flexeraeng.com\n\nImportant: The billing period (yyyy-mm) is the unit of ingestion. When a bill upload is committed and processed for a billing period, it replaces that month of data for the given bill connect and org. This API is not designed for daily incremental uploads; to change a month, upload the full month and commit again.\n\nTo remove existing billing data for a month, overwrite it by committing a new bill upload for the same billing period that contains no cost rows (for example, a CSV file with only the required header columns and no data rows). Note: a bill upload must contain at least one uploaded file to be committed.\n\nDefault limits (to override those, talk to your Flexera account manager):\n* Up to 500 files max per bill upload;\n* Each file must be at most 1000 MB;\n* 120 seconds \"cool off\" period between bill upload creations, for a given bill connect and billing period.\n\n## Auth\nRequests made to the API must be authenticated using a token obtained from the [Cloud Management API](https://docs.rightscale.com/api/general_usage.html#authentication).\nAn \"API-Version\" header must also be set; the current version is \"1.0\".\nThe API actions below list privileges (aka security scopes) required to access that particular action. Privileges are granted by\nroles in the [user governance application](https://docs.rightscale.com/cm/ref/user_roles.html).\n\nFor more detailed information on roles, see [policy access control](https://docs.rightscale.com/policies/#access-control).\n    "
    title: Flexera Cloud Cost Optimization Bill Upload API
    version: "1.0"
openapi: 3.0.0
paths:
    /optima/orgs/{orgId}/billUploads:
        get:
            description: |-
                Lists existing bill uploads. You can filter by bill upload and/or billing period, too..

                **Required security scopes for JWTAuth**:
                  * `optima:bill_upload:index+optima:bill_connect:index+common:org:own`
            operationId: BillUpload#index
            parameters:
                - description: Optional filter by billing period
                  in: query
                  name: billingPeriod
                  required: false
                  schema:
                    pattern: ^([0-9]{4})-([0-9]{2})$
                    type: string
                - description: Optional filter by bill connect ID
                  in: query
                  name: billConnectId
                  required: false
                  schema:
                    type: string
                - description: The relevant organization for the bill upload(s)
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/BillUploadBillUploadResponseCollection'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexNotFoundResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadIndexBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
        post:
            description: |-
                Creates a new bill upload, for a given [bill connect](https://reference.rightscale.com/optima-bill/#/CBIBillConnects) and billing period (month, yyyy-mm). Committing and processing a bill upload replaces that month of data for the bill connect/org.

                **Required security scopes for JWTAuth**:
                  * `optima:bill_upload:create+optima:bill_connect:create+common:org:own`
            operationId: BillUpload#create
            parameters:
                - description: The relevant organization for this bill upload
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillUploadCreateRequestBody'
                            required:
                                - billConnectId
                                - billingPeriod
                required: true
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateResponseBody'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateConflictResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
    /optima/orgs/{orgId}/billUploads/{billUploadId}:
        delete:
            description: |-
                Deletes a bill upload, provided  it is in the aborted state.

                **Required security scopes for JWTAuth**:
                  * `optima:bill_upload:delete+optima:bill_connect:delete+common:org:own`
            operationId: BillUpload#delete
            parameters:
                - description: The relevant organization for the bill upload
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: The identifier of the bill upload
                  in: path
                  name: billUploadId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteNotFoundResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadDeleteBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
        get:
            description: |-
                Shows the details of a bill upload, including the list of successfully uploaded files so far.

                **Required security scopes for JWTAuth**:
                  * `optima:bill_upload:show+optima:bill_connect:show+common:org:own`
            operationId: BillUpload#show
            parameters:
                - description: The relevant organization for the bill upload
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: The identifier of the bill upload
                  in: path
                  name: billUploadId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowResponseBody'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowNotFoundResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadShowBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
    /optima/orgs/{orgId}/billUploads/{billUploadId}/files/{fileId}:
        post:
            description: "Uploads a file, adding it to the given bill upload.\nNote, by default, you can only upload 500 files max per bill upload, and each must be smaller than 1000 MB.\nIf the upload is successful, a MD5 hash is returned, so that you can verify its integrity.\n        \n\n**Required security scopes for JWTAuth**:\n  * `optima:bill_upload:create+optima:bill_connect:create+common:org:own`"
            operationId: BillUpload#createFile
            parameters:
                - description: The relevant organization for this bill upload
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: The identifier of the bill upload
                  in: path
                  name: billUploadId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: 'The basename of the uploaded file (100 characters max), supported extensions: .csv, .json, .jsonl, gzipped or not'
                  in: path
                  name: fileId
                  required: true
                  schema:
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileResponseBody'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileConflictResponseBody'
                "413":
                    description: Request Entity Too Large response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileRequestEntityTooLargeResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateFileBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
    /optima/orgs/{orgId}/billUploads/{billUploadId}/operations:
        post:
            description: |-
                Performs an operation (i.e. commit or abort) on a bill upload. Committing triggers processing of all uploaded files and replaces that month of data for the bill connect/org; aborting closes the upload and any uploaded files will not be processed.

                **Required security scopes for JWTAuth**:
                  * `optima:bill_upload:create+optima:bill_connect:create+common:org:own`
            operationId: BillUpload#createOperation
            parameters:
                - description: The relevant organization for this bill upload
                  in: path
                  name: orgId
                  required: true
                  schema:
                    type: integer
                - description: The identifier of the bill upload
                  in: path
                  name: billUploadId
                  required: true
                  schema:
                    format: uuid
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillUploadCreateOperationRequestBody'
                            required:
                                - operation
                required: true
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationResponseBody'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationNotFoundResponseBody'
                "429":
                    description: Too Many Requests response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationTooManyRequestsResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillUploadCreateOperationBadGatewayResponseBody'
            schemes:
                - http
            security:
                - JWTAuth_header_Authorization: []
            tags:
                - BillUpload
servers:
    - url: https://localhost:80
