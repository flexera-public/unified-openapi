            description: |-
                The file resource is a sub resource of bill uploads and represents a single billing file that has been uploaded for a bill upload.
                                 The resource tracks the success of each upload as well as the file signature of the uploaded file,
                                allowing the client to validate that an upload was successful. (default view)
            example:
                billUploadId: 0ae0f4c1-7c3a-4172-bcce-e96b9927fa07
                createdAt: "2018-06-12T20:31:02Z"
                id: file1.csv
                length: 12345
                md5: 656fc88239fed34577fca4084cf2ad11
                status: uploaded
                updatedAt: "2018-06-12T20:31:02Z"
            properties:
                billUploadId:
                    description: The ID of the bill upload that the file belongs to
                    example: 0ae0f4c1-7c3a-4172-bcce-e96b9927fa07
                    format: uuid
                    type: string
                createdAt:
                    description: The time when the file was created.
                    example: "2018-06-12T20:31:02Z"
                    format: date-time
                    type: string
                id:
                    description: The ID of the file
                    example: file1.csv
                    type: string
                length:
                    description: The length of an uploaded file in bytes
                    example: 12345
                    format: int64
                    type: integer
                md5:
                    description: The file signature generated using MD5 message-digest
