        AllocationRuleRequestBody:
            description: |-
                AllocationRule maps a tag, cloud vendor account, or Azure resource group to a specific BillingCenter.
                One and only one of "tag", "cloud_vendor_account_ids" or "resource_groups" must be specified.
            example:
                billing_center:
                    href: /analytics/orgs/1/billing_centers/abc123
                cloud_vendor_account_ids:
                    - aws:012345678912
                resource_groups:
                    - cloud_vendor_account_id: "123456789012"
                      name: BTeam
                    - cloud_vendor_account_id: "123456789012"
                      name: BTeam
                tag: env=Production
            properties:
                billing_center:
                    $ref: '#/components/schemas/BillingCenterRefRequestBody'
                cloud_vendor_account_ids:
                    description: CloudVendorAccountIDs (for example ["aws:<AwsAccountNumber>"])
                    example:
                        - aws:012345678912
                    items:
                        example: Dolorum ab sunt neque.
                        type: string
                    type: array
                resource_groups:
                    description: Collection of Allocation Rule Resource Groups
                    example:
                        - cloud_vendor_account_id: "123456789012"
                          name: BTeam
                        - cloud_vendor_account_id: "123456789012"
                          name: BTeam
                        - cloud_vendor_account_id: "123456789012"
                          name: BTeam
                        - cloud_vendor_account_id: "123456789012"
                          name: BTeam
                    items:
                        $ref: '#/components/schemas/AllocationRuleResourceGroupRequestBody'
                    type: array
                tag:
                    description: full tag
                    example: env=Production
                    type: string
            required:
                - billing_center
            title: AllocationRuleRequestBody
            type: object
