info:
    description: |-
        Public API for characterizing and analyzing cloud spend.

        The API is available at the following endpoints:
        * (NAM) https://api.optima.flexeraeng.com
        * (EU) https://api.optima-eu.flexeraeng.com
    title: Flexera Cloud Cost Optimization Billing Centers API
    version: ""
openapi: 3.0.0
paths:
    /analytics/orgs/{org_id}/allocation_table:
        get:
            description: |-
                List the AllocationTable rules for a given Org

                **Required security scopes for GlobalSession**:
                  * `optima:billing_center:show+common:org:own`
            operationId: AllocationTable#show
            parameters:
                - description: Identifies an organization by ID
                  in: path
                  name: org_id
                  required: true
                  schema:
                    type: integer
                - description: API Version, must be specified using this header
                  in: header
                  name: Api-Version
                  required: true
                  schema:
                    enum:
                        - "0.1"
                        - "1.0"
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableShowResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableShowForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableShowNotFoundResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableShowInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableShowBadGatewayResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: List the AllocationTable rules for a given Org
            tags:
                - AllocationTable
        put:
            description: |-
                Update an AllocationTable

                **Required security scopes for GlobalSession**:
                  * `optima:billing_center:update+common:org:own`
            operationId: AllocationTable#upsert
            parameters:
                - description: The version sequence number
                  in: query
                  name: sequence_number
                  required: false
                  schema:
                    type: integer
                - in: path
                  name: org_id
                  required: true
                  schema:
                    type: integer
                - description: API Version, must be specified using this header
                  in: header
                  name: Api-Version
                  required: true
                  schema:
                    enum:
                        - "0.1"
                        - "1.0"
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AllocationTableUpsertRequestBody'
                            required:
                                - allocation_rules
                required: true
            responses:
                "204":
                    description: No Content response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertBadRequestResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertConflictResponseBody'
                "422":
                    description: Unprocessable Entity response.
                    schema:
                        items:
                            $ref: '#/components/schemas/InvalidAllocationTableRuleErrorResponse'
                        type: array
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/AllocationTableUpsertBadGatewayResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: Update an AllocationTable or create it if it doesn't exist
            tags:
                - AllocationTable
    /analytics/orgs/{org_id}/billing_centers:
        get:
            description: |-
                List all the BillingCenter resources in a given Org

                **Required security scopes for GlobalSession**:
                  * `optima:billing_center:index+common:org:own`
            operationId: BillingCenters#index
            parameters:
                - description: Optional view selection
                  in: query
                  name: view
                  required: false
                  schema:
                    default: default
                    enum:
                        - default
                        - allocation_table
                    type: string
                - in: path
                  name: org_id
                  required: true
                  schema:
                    type: integer
                - description: API Version, must be specified using this header
                  in: header
                  name: Api-Version
                  required: true
                  schema:
                    enum:
                        - "0.1"
                        - "1.0"
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersBillingCenterResponseCollection'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexNotFoundResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexBadGatewayResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersIndexServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: List all BillingCenters in a given Org.
            tags:
                - BillingCenters
        post:
            description: |-
                Create a new BillingCenter

                **Required security scopes for GlobalSession**:
                  * `optima:billing_center:create+common:org:own`
            operationId: BillingCenters#create
            parameters:
                - in: path
                  name: org_id
                  required: true
                  schema:
                    type: integer
                - description: API Version, must be specified using this header
                  in: header
                  name: Api-Version
                  required: true
                  schema:
                    enum:
                        - "0.1"
                        - "1.0"
                    type: string
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BillingCentersCreateRequestBody'
                            required:
                                - name
                                - description
                required: true
            responses:
                "201":
                    description: Created response.
                    headers:
                        Location:
                            description: Location of resource
                            type: string
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateResponseBody'
                        required:
                            - id
                            - href
                            - name
                            - description
                            - created_at
                            - updated_at
                            - kind
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateBadRequestResponseBody'
                "401":
                    description: Unauthorized response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateUnauthorizedResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateConflictResponseBody'
                "422":
                    description: Unprocessable Entity response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateUnprocessableEntityResponseBody'
                "500":
                    description: Internal Server Error response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateInternalErrorResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateBadGatewayResponseBody'
                "503":
                    description: Service Unavailable response.
                    schema:
                        $ref: '#/components/schemas/BillingCentersCreateServiceUnavailableResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: Create a new BillingCenter
            tags:
                - BillingCenters
    /analytics/orgs/{org_id}/billing_centers/{billing_center}:
        delete:
            description: |-
                Delete a BillingCenter

                **Required security scopes for GlobalSession**:
                  * `optima:billing_center:delete+common:org:own`
            operationId: BillingCenters#delete
            parameters:
