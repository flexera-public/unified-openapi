components:
    schemas:
        DataFieldResponse:
            description: Extended details data field
            example:
                label: Net Savings
                value: 1
            properties:
                label:
                    description: Field Label
                    example: Net Savings
                    type: string
                value:
                    description: Field Value
                    example: 1
                    format: binary
                    type: string
            required:
                - label
                - value
            title: DataFieldResponse
            type: object
        RecommendationResultResponse:
            description: A cost-saving recommendation. (default view)
            example:
                accountID: 1234-5678-9012
                accountName: Test Account
                billingCenterID: o5g6iXY0AQADmckH0gjaAi
                billingCenterName: Marketing
                createdAt: "2021-08-22T00:00:00Z"
                customTagDimensions:
                    tag_1: demoMachine
                    tag_2: randomName
                databaseEngine: MySQL
                details:
                    Location: centralus
                    Net Savings: "50.98"
                    Total RI Quantity to Purchase: 1
                detailsExtended:
                    location:
                        label: Location
                        value: centralus
                    quantityToPurchase:
                        label: Total RI Quantity to Purchase
                        value: 1
                    savings:
                        label: Net Savings
                        value: "50.98"
                id: C94ACE00-272B-4ADE-B6C2-3C2C0869E130
                incidentID: 66db5ea9d7048a1c94c09636
                kind: optima#recommendation
                policySet: Idle Compute Instances
                quantityToPurchase: 3
                recommendation: AWS Savings Plan
                region: US West (Oregon)
                resourceGroup: RS-DEFAULT-EASTUS
                resourceID: vol-0475890d8fc70a26f
                resourceType: m5.2xlarge
                ruleBasedDimensions:
                    rbd_1: demoMachine
                    rbd_2: randomName
                savings: 361.5
                service: EC2
                snoozedTargetDate: "2025-01-30"
                status: active
                statusReason: Moved to snoozed since it is not relevant for now
                statusUpdatedAt: "2021-08-22T00:00:00Z"
                tags:
                    - env=production
                type: Rate Reduction
                updatedAt: "2021-08-22T00:00:00Z"
                vendor: AWS
            properties:
                accountID:
                    description: The account ID
                    example: 1234-5678-9012
                    type: string
                accountName:
                    description: The account name
                    example: Test Account
                    type: string
                billingCenterID:
                    description: The ID of the top-level billing center this recommendation is assigned to
                    example: o5g6iXY0AQADmckH0gjaAi
                    type: string
                billingCenterName:
                    description: The name of the top-level billing center this recommendation is assigned to
                    example: Marketing
                    type: string
                createdAt:
                    description: Timestamp when the recommendation was created.
                    example: "2021-08-22T00:00:00Z"
                    format: date-time
                    type: string
                customTagDimensions:
                    additionalProperties:
                        example: Voluptatem velit sint esse.
                        type: string
                    description: The custom tag dimensions that could be populated by the raw tags of the recommendation.
                    example:
                        tag_1: demoMachine
                        tag_2: randomName
                    type: object
                databaseEngine:
                    description: The database engine to purchase
                    example: MySQL
                    type: string
                details:
                    additionalProperties: true
                    description: Additional details about the recommendation.
                    example:
                        Location: centralus
                        Net Savings: "50.98"
                        Total RI Quantity to Purchase: 1
                    type: object
                detailsExtended:
                    additionalProperties:
                        $ref: '#/components/schemas/DataFieldResponse'
                    description: Extended details about the recommendation.
                    example:
                        location:
                            label: Location
                            value: centralus
                        quantityToPurchase:
                            label: Total RI Quantity to Purchase
                            value: 1
                        savings:
                            label: Net Savings
                            value: "50.98"
                    type: object
                id:
                    description: The ID of the recommendation
                    example: C94ACE00-272B-4ADE-B6C2-3C2C0869E130
                    type: string
                incidentID:
                    description: ID of the incident that recommendation belongs to
                    example: 66db5ea9d7048a1c94c09636
                    type: string
                kind:
                    description: The kind of object
                    enum:
                        - optima#recommendation
                    example: optima#recommendation
                    type: string
                policySet:
                    description: The policy set, as a way to group similar policies together
                    example: Idle Compute Instances
                    type: string
                quantityToPurchase:
                    description: Quantity to purchase (e.g. number of reserved instances)
                    example: 3
                    format: double
                    type: number
                recommendation:
                    description: This is the name or category of recommendation
                    example: AWS Savings Plan
                    type: string
                region:
                    description: The region in which to purchase
                    example: US West (Oregon)
                    type: string
                resourceGroup:
                    description: Azure Resource Group
                    example: RS-DEFAULT-EASTUS
                    type: string
                resourceID:
                    description: The ID of a resource identified in the recommendation
                    example: vol-0475890d8fc70a26f
                    type: string
                resourceType:
                    description: The resource type, which might be an instance type or volume type, etc.
                    example: m5.2xlarge
                    type: string
                ruleBasedDimensions:
                    additionalProperties:
                        example: Aperiam voluptatem sint.
                        type: string
                    description: The rule based dimensions that are populated in recommendation once rules execute.
                    example:
                        rbd_1: demoMachine
                        rbd_2: randomName
                    type: object
                savings:
                    description: Expected dollar savings
                    example: 361.5
                    format: double
                    type: number
                service:
                    description: The relevant service in which to purchase
                    example: EC2
                    type: string
                snoozedTargetDate:
                    description: Target date to move recommendation from snoozed to active again
                    example: "2025-01-30"
                    format: date
                    type: string
                status:
                    default: active
                    description: Current status of the recommendation
                    example: active
                    type: string
                statusReason:
                    description: Extra field to put extra reason once we change “status” value
                    example: Moved to snoozed since it is not relevant for now
                    type: string
                statusUpdatedAt:
                    description: Date when status was updated
                    example: "2021-08-22T00:00:00Z"
                    format: date-time
                    type: string
                tags:
                    description: The tags found on the resource
                    example:
                        - env=production
                    items:
                        example: Et eum unde temporibus earum et quia.
                        type: string
                    type: array
                type:
                    description: Categorizes the type of recommendation
                    enum:
                        - Rate Reduction
                        - Usage Reduction
                    example: Rate Reduction
                    type: string
                updatedAt:
                    description: Timestamp when the recommendation was updated.
                    example: "2021-08-22T00:00:00Z"
                    format: date-time
                    type: string
                vendor:
                    description: The name of the cloud vendor
                    example: AWS
                    type: string
            required:
                - kind
                - id
                - recommendation
                - type
                - createdAt
                - updatedAt
                - vendor
                - policySet
                - accountID
                - accountName
                - tags
                - resourceID
                - resourceType
                - region
                - service
                - databaseEngine
                - billingCenterName
                - billingCenterID
                - savings
                - quantityToPurchase
                - incidentID
                - status
            title: 'Mediatype identifier: application/vnd.flexera.optima.recommendation+json; view=default'
            type: object
