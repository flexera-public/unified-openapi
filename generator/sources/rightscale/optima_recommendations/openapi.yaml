                    | billingCenterName    | Returns recommendations ordered by the name of the billing center they are listed under (the Cost Center column) |
                    | tags                 | Returns recommendations ordered by their tags joined with ', ' as the Tags column shows them ('' for none) |
                    | detailsExtended.<key> | Returns recommendations ordered by the value of the 'detailsExtended' entry <key>. Requires view=extended, otherwise the request fails with a 400 error |

                    ### Notes
                    - The orderBy is a query parameter. While it needs to be URL-encoded, examples here are provided pre-URL-encoding for clarity.
                    - Multiple expressions can be comma separated.
                    - All orderBy fields support two types of order: "asc" (ascending) and "desc" (descending), "asc" will be used if no one is specified.

                    ### Examples
                    | Example                    | Description                                                         |
                    | -------------------------- | ------------------------------------------------------------------- |
                    | savings                    | Order recommendations by savings ascending                          |
                    | savings desc               | Order recommendations by savings descending                         |
                    | vendor, savings desc       | Order recommendations by vendor ascending, then by savings descending |
                  in: query
                  name: orderBy
                  required: false
                  schema:
                    type: string
                - description: "An opaque token to be provided when requesting a subsequent page after receiving a partial response. \nPartial responses will include a \"nextPage\" attribute in their response body, which contains the URL of the next page including the appropriate skipToken."
                  in: query
                  name: skipToken
                  required: false
                  schema:
                    type: string
                - description: Custom pagination limit to be used.
                  in: query
                  name: limit
                  required: false
                  schema:
                    type: integer
                - description: The organization ID
                  in: path
                  name: orgID
                  required: true
                  schema:
                    type: integer
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedResponseBody'
                    description: OK response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedBadRequestResponseBody'
                    description: Bad Request response.
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedForbiddenResponseBody'
                    description: Forbidden response.
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedNotFoundResponseBody'
                    description: Not Found response.
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedConflictResponseBody'
                    description: Conflict response.
                "502":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RecommendationsRecommendationsPagedBadGatewayResponseBody'
                    description: Bad Gateway response.
            security:
                - GlobalSession_header_Authorization: []
            summary: List recommendations (filtered, sorted, cursor-paginated)
            tags:
                - Recommendations
