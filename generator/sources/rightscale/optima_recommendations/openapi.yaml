                    description: Target date to move recommendation from snoozed to active again
                    example: "2025-01-30"
                    type: string
                status:
                    description: New status of recommendation
                    enum:
                        - active
                        - snoozed
                        - rejected
                        - realized
                    example: realized
                    type: string
                statusReason:
                    description: Reason of new status of recommendation
                    example: Recommendation isn't relevant right now
                    type: string
            required:
                - id
                - status
            title: RecommendationsUpdateStatusRequestBody
            type: object
info:
    description: |
        An API for recommendations that identify areas where you can save costs.

        The API is available at the following endpoints:
        * (NAM)  https://api.optima.flexeraeng.com
        * (EMEA) https://api.optima-eu.flexeraeng.com
        * (APAC) https://api.optima-apac.flexeraeng.com

        ## Auth
        Flexera Recommendations API uses rsauth-style tokens for both inbound authentication/authorization.
        The following are the scopes defined in this service:
        * optima:recommendation:index+common:org:own - Used for listing recommendations
    title: Flexera Cloud Cost Optimization Recommendations API
    version: ""
openapi: 3.0.0
paths:
    /recommendations/orgs/{orgID}/recommendations:
        get:
            description: |-
                List all recommendations.
                User must have the 'optima:recommendation:index' privilege on the org or on the specified billing center(s) to make this call.

                **Required security scopes for GlobalSession**:
                  * `common:org:affiliated+common:org:own`
            operationId: Recommendations#index
            parameters:
                - collectionFormat: multi
                  description: IDs of BillingCenters to get recommendations for. It is not allowed for any of the BillingCenterIDs to be an ancestor of another specified BillingCenterID.
                  in: query
                  name: billingCenterIDs
                  required: false
                  schema:
                    items:
                        type: string
                    type: array
                - description: An optional parameter that controls the level of detail returned about policy violation data. Depending on it the data is returned in the `details` or `detailsExtended` field
                  in: query
                  name: view
                  required: false
                  schema:
                    default: default
                    enum:
                        - default
                        - extended
                    type: string
                - collectionFormat: multi
                  description: Recommendation statuses to get
                  in: query
                  name: statuses
                  required: false
                  schema:
                    default:
                        - active
                    items:
                        enum:
                            - active
                            - snoozed
                            - rejected
                            - realized
                        type: string
                    type: array
                - description: The organization ID
                  in: path
                  name: orgID
                  required: true
                  schema:
                    type: integer
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsRecommendationResultResponseCollection'
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsIndexBadRequestResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsIndexForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsIndexNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsIndexConflictResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsIndexBadGatewayResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: List all recommendations
            tags:
                - Recommendations
    /recommendations/orgs/{orgID}/recommendations/updatestatus:
        put:
            description: |-
                Update the status of a recommendation

                **Required security scopes for GlobalSession**:
                  * `common:org:affiliated+common:org:own`
            operationId: Recommendations#updateStatus
            parameters:
                - description: Organization ID
                  in: path
                  name: orgID
                  required: true
                  schema:
                    type: integer
                - description: JWT token used to perform authorization
                  in: header
                  name: Authorization
                  required: false
                  schema:
                    type: string
                - in: body
                  name: UpdateStatusRequestBody
                  required: true
                  schema:
                    $ref: '#/components/schemas/RecommendationsUpdateStatusRequestBody'
                    required:
                        - id
                        - status
            responses:
                "200":
                    description: OK response.
                "400":
                    description: Bad Request response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsUpdateStatusBadRequestResponseBody'
                "403":
                    description: Forbidden response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsUpdateStatusForbiddenResponseBody'
                "404":
                    description: Not Found response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsUpdateStatusNotFoundResponseBody'
                "409":
                    description: Conflict response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsUpdateStatusConflictResponseBody'
                "502":
                    description: Bad Gateway response.
                    schema:
                        $ref: '#/components/schemas/RecommendationsUpdateStatusBadGatewayResponseBody'
            schemes:
                - http
            security:
                - GlobalSession_header_Authorization: []
            summary: updateStatus Recommendations
            tags:
                - Recommendations
servers:
    - url: https://localhost:80
