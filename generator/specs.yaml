  - id: flexera-risk-v1
    name: "Flexera Risk Management API"
    vendor: flexera
    service: risk
    version: v1
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/risk/v1/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/risk/v1"
      filename: "openapi.json"
    processing:
      - type: download
      - type: unwrap-single-anyof
        reason: "Risk spec uses `anyOf:[X]` (singletons after null-variant stripping) as a placeholder for non-required fields; oapi-codegen generates index-suffixed types per anyOf variant that collide on titles like 'Providers'. Collapse singleton anyOf wrappers."

