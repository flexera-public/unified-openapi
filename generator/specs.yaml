  - id: flexera-data-inventory-v1
    name: "Flexera Data Inventory API"
    vendor: flexera
    service: divnt
    version: v1
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/divnt/v1/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/divnt/v1"
      filename: "openapi.json"
    processing:
      - type: download
      - type: remove-local-ref
        ref: "#/components/schemas/AzureCostAndUsageUpdateModel"
        reason: "Remove an upstream dangling ref; the documented update fields are already optional fields in AzureCostAndUsageModel."

