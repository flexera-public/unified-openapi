      filename: "openapi.json"
    processing:
      - type: download

  - id: flexera-grs
    name: "Flexera Global Resource Service API"
    vendor: flexera
    service: grs
    version: v2
    source:
      type: manual
      description: "Hand-curated minimal OpenAPI subset for the Flexera Global Resource Service (GRS). GRS is a legacy internal Praxis Ruby app being deprecated; it does not publish a real upstream spec. This file documents only the GRS endpoints that the unified Flexera One SDK helpers depend on (currently project/org lookup by user). Add new endpoints only when an SDK helper requires them; remove this spec once GRS is fully deprecated."
    format: openapi3-json
    output:
      path: "sources/flexera/grs/v2"
      filename: "openapi.json"
    processing:
      - type: manual
        notes: "Hand-maintained in-repo. Add new endpoints only when a unified SDK helper requires them; remove once GRS is fully deprecated and no helpers depend on it."

  # RightScale APIs
  - id: rightscale-governance
    name: "RightScale Governance Policies API"
    vendor: rightscale
    service: governance
    version: ""
    source:
      type: url
      url: "https://reference.rightscale.com/governance-policies/swagger.json"
    format: swagger2-json
    output:
      path: "sources/rightscale/governance"
      filename: "openapi.yaml"
    processing:
      - type: download
        output: "swagger.json"
      - type: convert
        from: "swagger2"
        to: "openapi3"
        input: "swagger.json"
        output: "openapi.yaml"
        format: yaml

  - id: rightscale-optima-recommendations
    name: "RightScale Optima Recommendations API"
    vendor: rightscale
    service: optima_recommendations
    version: ""
    include_in_merge: true
    source:
      type: url
      url: "https://reference.rightscale.com/optima-recommendations/swagger.json"
    format: swagger2-json
    output:
      path: "sources/rightscale/optima_recommendations"
      filename: "openapi.yaml"
    processing:
      - type: download
        output: "swagger.json"
      - type: convert
        from: "swagger2"
        to: "openapi3"
        input: "swagger.json"
        output: "openapi.yaml"
        format: yaml
    # Confirmed via infra-optima's optima-api-virtualservice Istio config
    # (production-{us,eu,au}/optima-ba/ingresses): the /recommendations route
    # is served on api.optima(-eu|-apac).flexeraeng.com, not the default
    # Flexera One api.flexera.{zone} gateway host used by other merged specs.
    merge_servers:
      - url: "https://api.optima{zone}.flexeraeng.com"
        description: "Flexera Optima Recommendations API"
        variables:
          zone:
            default: ""
            enum: ["", "-eu", "-apac"]
            description: "'' = NAM, -eu = EMEA, -apac = APAC"

  - id: rightscale-billing-center
    name: "RightScale Billing Center API"
    vendor: rightscale
    service: billing_center_service
    version: ""
    include_in_merge: true
    source:
      type: url
      url: "https://reference.rightscale.com/billing_center/swagger.json"
    format: swagger2-json
    output:
      path: "sources/rightscale/billing_center_service"
      filename: "openapi.yaml"
    processing:
      - type: download
        output: "swagger.json"
      - type: convert
        from: "swagger2"
        to: "openapi3"
        input: "swagger.json"
        output: "openapi.yaml"
        format: yaml
    # Upstream spec's own description only documents NAM/EU, but the
    # `/analytics` route is served by the same optima-api-virtualservice
    # (same host, all 3 regions) as bill_analysis and optima_recommendations
    # in infra-optima's production-{us,eu,au} Istio configs, confirming
    # APAC (api.optima-apac.flexeraeng.com) is also live for this service.
    merge_servers:
      - url: "https://api.optima{zone}.flexeraeng.com"
        description: "Flexera Optima Billing Center API"
        variables:
          zone:
            default: ""
            enum: ["", "-eu", "-apac"]
            description: "'' = NAM, -eu = EU, -apac = APAC"

  - id: rightscale-bill-analysis
    name: "RightScale Bill Analysis API"
    vendor: rightscale
    service: bill_analysis
    version: ""
    include_in_merge: true
    source:
      type: manual
      description: "Hand-curated minimal OpenAPI subset for the Bill Analysis API. This file documents only the Bill Analysis endpoints that have not been migrated to Flexera API Gateway. Add new endpoints only when a downstream consumer requires them; remove this spec once Bill Analysis is fully deprecated."

      url: "https://github.com/flexera/bill_analysis/blob/master/front_service/gen/http/openapi3.json"
    # Bill Analysis Public-URL source
    # source:
    #   type: url
    #   url: "https://reference.rightscale.com/bill_analysis/swagger.json"
    # format: swagger2-json
    format: openapi3-yaml
    output:
      path: "sources/rightscale/bill_analysis"
      filename: "openapi.json"
    # Confirmed via infra-optima's optima-api-virtualservice Istio config
    # (production-{us,eu,au}/optima-ba/ingresses): the /bill-analysis route
    # is served on api.optima(-eu|-apac).flexeraeng.com, not the default
    # Flexera One api.flexera.{zone} gateway host used by other merged specs.
    merge_servers:
      - url: "https://api.optima{zone}.flexeraeng.com/bill-analysis"
        description: "Flexera Optima Bill Analysis API"
        variables:
          zone:
            default: ""
            enum: ["", "-eu", "-apac"]
            description: "'' = NAM, -eu = EU, -apac = APAC"
    processing:
      - type: manual
        notes: "Hand-maintained in-repo. Add new endpoints only when a downstream consumer requires them; remove once Bill Analysis is fully deprecated."
      # Or use public RightScale swagger.json
      # Kept in case we ever revert to the Bill Analysis Public-URL source above
      # - type: download
      #   output: "swagger.json"
      # - type: convert
      #   from: "swagger2"
      #   to: "openapi3"
      #   input: "swagger.json"
      #   output: "openapi.json"
      #   format: json
    merge_exclude_paths:
      - path: "/bill-analysis/orgs/{org}/budgets"
        reason: "Migrated to Flexera Budget API: GET/POST /finops-analytics/v1/orgs/{orgId}/budgets (Budget_Budget_index/create)."
      - path: "/bill-analysis/orgs/{org}/budgets/{id}"
        reason: "Migrated to Flexera Budget API: GET/PUT/DELETE /finops-analytics/v1/orgs/{orgId}/budgets/{id} (Budget_Budget_show/update/delete)."
      - path: "/bill-analysis/orgs/{org}/budgets/{id}/report"
        reason: "Migrated to Flexera Budget API: GET /finops-analytics/v1/orgs/{orgId}/budgets/{id}/report (Budget_Budget_report)."
      - path: "/bill-analysis/orgs/{org}/settings/rule_based_dimensions"
        reason: "Migrated to Flexera FinOps Customizations API: GET/PUT /finops-customizations/v1/orgs/{orgId}/rule-based-dimensions (FinopsCustomizations_Rule_Based_Dimension_index, upsert via create/update)."
      - path: "/bill-analysis/orgs/{org}/settings/rule_based_dimensions/{id}"
        reason: "Migrated to Flexera FinOps Customizations API: CRUD on /finops-customizations/v1/orgs/{orgId}/rule-based-dimensions/{id}."
      - path: "/bill-analysis/orgs/{org}/settings/rule_based_dimensions/{id}/rules/{effective_at}"
        reason: "Migrated to Flexera FinOps Customizations API: /finops-customizations/v1/orgs/{orgId}/rule-based-dimensions/{id}/rules/{effectiveAt} (rules_list_show/replace/delete)."

