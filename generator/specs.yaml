  - id: flexera-vis-v2
    name: "Flexera IT Visibility Insights API"
    vendor: flexera
    service: vis
    version: v2
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/vis/v2/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/vis/v2"
      filename: "openapi.json"
    processing:
      - type: download
      - type: set-operation-id
        path: "/vis/v2/orgs/{orgId}/exports"
        method: get
        operation_id: ExportIndex
        reason: "Give the upstream list and download operations distinct, stable names."
      - type: set-operation-id
        path: "/vis/v2/orgs/{orgId}/exports/files/{id}"
        method: get
        operation_id: ExportDownload
        reason: "Give the upstream list and download operations distinct, stable names."

