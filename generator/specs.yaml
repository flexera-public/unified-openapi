  - id: flexera-finops-billing-v1
    name: "Flexera FinOps Billing API"
    vendor: flexera
    service: finops_billing
    version: v1
    source:
      type: url
      url: "https://developer.flexeratest.com/openapi/services/finops-billing/v1/openapi.json"
