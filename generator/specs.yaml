  - id: flexera-vis-v2
    name: "Flexera IT Visibility Insights API"
    vendor: flexera
    service: vis
    version: v2
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/vis/v2/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/vis/v2"
      filename: "openapi.json"
    processing:
      - type: download
      - type: sed-replace
        pattern: "\"Download returns the specified export file.\",\"operationId\":\"Export \""
        replacement: "\"Download returns the specified export file.\",\"operationId\":\"ExportDownload\""
        reason: "Upstream vis spec uses the same operationId 'Export ' for both GET /exports and GET /exports/files/{id}; disambiguate the download endpoint first."
      - type: sed-replace
        pattern: "\"operationId\":\"Export \""
        replacement: "\"operationId\":\"ExportIndex\""
        reason: "Rename the remaining 'Export ' (list endpoint) so unique-operationId validation passes after Vis_ prefixing."

