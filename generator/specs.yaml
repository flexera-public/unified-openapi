# OpenAPI Specification Configuration
# Defines all API specs, their sources, and processing requirements

specs:
  # Flexera APIs
  - id: flexera-budget-v1
    name: "Flexera Budget API"
    vendor: flexera
    service: budget
    version: v1
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/finops-analytics/v1/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/budget/v1"
      filename: "openapi.json"
    processing:
      - type: download

  - id: flexera-policy-v1
    name: "Flexera Policy API"
    vendor: flexera
    service: policy
    version: v1
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/policy/v1/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/policy/v1"
      filename: "openapi.json"
    processing:
      - type: download
      - type: sed-replace
        pattern: "AppliedPolicyStatus"
        replacement: "AppliedPolicyStatusDetail"
        reason: "Fix duplicate typename 'AppliedPolicyStatus' in spec"

  - id: flexera-graphql-v1
    name: "Flexera GraphQL API"
    vendor: flexera
    service: graphql
