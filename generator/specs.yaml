  - id: flexera-risk-v1
    name: "Flexera Risk Management API"
    vendor: flexera
    service: risk
    version: v1
    source:
      type: url
      url: "https://developer.flexera.com/openapi/services/risk/v1/openapi.json"
    format: openapi3-json
    output:
      path: "sources/flexera/risk/v1"
      filename: "openapi.json"
    processing:
      - type: download
      - type: sed-replace
        pattern: "\"name\":\"org_id\",\"required\":true,\"schema\":{\"description\":\"Organization ID\",\"title\":\"Org Id\",\"type\":\"string\"}"
        replacement: "\"name\":\"orgId\",\"required\":true,\"schema\":{\"description\":\"Organization ID\",\"title\":\"Org Id\",\"type\":\"string\"}"
        reason: "Upstream risk spec declares path /risk/v1/orgs/{orgId}/compliances/ but names its path parameter 'org_id', breaking oapi-codegen path/parameter resolution; align the parameter name with the path template."
      - type: sed-replace
        pattern: ",{\"type\":\"null\"}]"
        replacement: "]"
        reason: "Risk spec is OpenAPI 3.1 and uses `anyOf:[..., {type:null}]` for nullable fields; oapi-codegen v2.5 rejects the null variant. Strip the trailing null variant from anyOf arrays."
      - type: sed-replace
        pattern: "{\"type\":\"null\"},"
        replacement: ""
        reason: "Strip leading/middle null variants from anyOf arrays for the same reason."
      - type: sed-replace
        pattern: ",{\"items\":{\"const\":\"all\",\"type\":\"string\"},\"type\":\"array\"}"
        replacement: ""
        reason: "Risk spec models `['all']` sentinel as a second `anyOf` array variant alongside the plain string-array; oapi-codegen names both `Providers0` etc. and fails on duplicate typenames. Drop the const-'all' variant since callers can still pass the literal value within the string array."
      - type: unwrap-single-anyof
        reason: "Risk spec uses `anyOf:[X]` (singletons after null-variant stripping) as a placeholder for non-required fields; oapi-codegen generates index-suffixed types per anyOf variant that collide on titles like 'Providers'. Collapse singleton anyOf wrappers."

