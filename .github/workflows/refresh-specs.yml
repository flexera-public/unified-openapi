name: refresh-openapi-specs

# Daily (or manually-triggered) refresh of upstream OpenAPI source specs and
# regeneration of the unified openapi3.json / openapi3.yaml artifacts. Any
# resulting changes are pushed to a long-lived branch and opened/updated as a
# pull request for review, with a summary of what changed.

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-openapi-specs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: generator/go.mod

      - name: Capture comparison baseline
        id: baseline
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh sources and regenerate unified spec
        run: make refresh REPORT_CHANGES=0

      - name: Run tests
        run: make test

      - name: Build functional change summary
        id: summary
        env:
          BASE_REF: ${{ steps.baseline.outputs.sha }}
        run: |
          report_dir=$(mktemp -d)
          (cd generator && go run . changes --base-ref "$BASE_REF" \
            --json-output "$report_dir/changes.json" \
            --markdown-output "$report_dir/changes.md")
          echo "has-functional-changes=$(jq -er '.has_functional_changes | tostring' "$report_dir/changes.json")" >> "$GITHUB_OUTPUT"
          echo "version-impact=$(jq -er '.version_impact' "$report_dir/changes.json")" >> "$GITHUB_OUTPUT"
          cat "$report_dir/changes.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "## Automated OpenAPI spec refresh"
            echo ""
            echo "Generated by the [refresh-openapi-specs](.github/workflows/refresh-specs.yml) workflow."
            echo ""
            cat "$report_dir/changes.md"
          } > /tmp/pr-body.md

      - name: Create or update pull request
        if: steps.summary.outputs.has-functional-changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: ${{ github.event.repository.default_branch }}
          commit-message: "chore: refresh upstream OpenAPI specs and regenerate unified spec"
          branch: automated/refresh-openapi-specs
          delete-branch: false
          title: "chore: automated OpenAPI spec refresh (${{ steps.summary.outputs.version-impact }})"
          body-path: /tmp/pr-body.md
          add-paths: |
            generator/sources
            openapi3.json
            openapi3.yaml
