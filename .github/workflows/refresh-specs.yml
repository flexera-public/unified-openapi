name: refresh-openapi-specs

# Daily (or manually-triggered) refresh of upstream OpenAPI source specs and
# regeneration of the unified openapi3.json / openapi3.yaml artifacts. Any
# resulting changes are pushed to a long-lived branch and opened/updated as a
# pull request for review, with a summary of what changed.

on:
  schedule:
    - cron: '0 6 * * *' # daily at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-openapi-specs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: generator/go.mod

      - name: Fetch upstream specs
        working-directory: generator
        run: go run . fetch all

      - name: Regenerate unified spec
        run: make merge

      - name: Run tests
        run: make test

      - name: Build change summary
        id: summary
        run: |
          {
            echo "## Automated OpenAPI spec refresh"
            echo ""
            echo "Generated by the [refresh-openapi-specs](.github/workflows/refresh-specs.yml) workflow."
            echo ""
            if git diff --quiet; then
              echo "_No changes detected upstream._"
            else
              echo "### Changed files"
              echo ""
              echo '```'
              git diff --stat
              echo '```'
            fi
          } > /tmp/pr-body.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: refresh upstream OpenAPI specs and regenerate unified spec"
          branch: automated/refresh-openapi-specs
          delete-branch: false
          title: "chore: automated OpenAPI spec refresh"
          body-path: /tmp/pr-body.md
          add-paths: |
            generator/sources
            openapi3.json
            openapi3.yaml
